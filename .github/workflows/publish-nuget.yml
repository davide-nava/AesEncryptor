name: Publish NuGet

on:
    release:
        types:
            - published

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        runs-on: windows-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup .NET 11 RC
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "11.0.x"
                  include-prerelease: true

            - name: Extract Version
              shell: pwsh
              run: |
                  $version = "${{ github.event.release.tag_name }}".TrimStart('v')
                  "VERSION=$version" | Out-File $env:GITHUB_ENV -Append
                  Write-Host "Version: $version"

            - name: Restore
              shell: pwsh
              run: |
                  dotnet restore

            - name: Build
              shell: pwsh
              run: |
                  dotnet build `
                    src/AesEncryptor/AesEncryptor.csproj `
                    -c Release `
                    --no-restore `
                    -p:Version=${{ env.VERSION }} `
                    -p:AssemblyVersion=${{ env.VERSION }} `
                    -p:FileVersion=${{ env.VERSION }}

            - name: Test
              shell: pwsh
              run: |
                  dotnet test `
                  tests/AesEncryptor.UnitTests/AesEncryptor.UnitTests.csproj `
                  -c Release

            - name: Pack
              shell: pwsh
              run: |
                  dotnet pack `
                  src/AesEncryptor/AesEncryptor.csproj `
                  -c Release `
                  --no-build `
                  -o artifacts `
                  -p:Version=${{ env.VERSION }} `
                  -p:PackageVersion=${{ env.VERSION }} `
                  -p:AssemblyVersion=${{ env.VERSION }} `
                  -p:FileVersion=${{ env.VERSION }}

            - name: Verify Package
              shell: pwsh
              run: |
                  Get-ChildItem artifacts

            - name: Debug Identity
              shell: pwsh
              run: |
                  Write-Host "Workflow: ${{ github.workflow }}"
                  Write-Host "Workflow Ref: ${{ github.workflow_ref }}"
                  Write-Host "Repository: ${{ github.repository }}"

            - name: NuGet Login (OIDC)
              id: login
              uses: NuGet/login@v1
              with:
                  user: ${{ secrets.NUGET_USER }}

            - name: Publish to NuGet
              shell: pwsh
              run: |
                  dotnet nuget push "artifacts\*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
